<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f4;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        .output {
            background: white;
            border: 1px solid #ccc;
            padding: 15px;
            margin-top: 15px;
            max-width: 700px;
        }
    </style>
</head>

<body>

    <h2>Exploring the Fetch API</h2>

    <button id="loadData">Load Post Data (GET)</button>

    <button id="sendData">Create New Post (POST)</button>

    <div id="output" class="output">
        The result will appear here.
    </div>

    <script>

        const output = document.getElementById("output");

        // GET REQUEST
        document.getElementById("loadData").addEventListener("click", function() {

            output.textContent = "Loading post data...";

            fetch("https://jsonplaceholder.typicode.com/posts/1")

                .then(response => {
                    if (!response.ok) {
                        throw new Error("HTTP error! Status: " + response.status);
                    }

                    return response.json();
                })

                .then(data => {
                    output.innerHTML = `
                        <strong>Post Title:</strong> ${data.title}<br><br>
                        <strong>Content:</strong> ${data.body}
                    `;
                })

                .catch(error => {
                    output.textContent = "Error: " + error.message;
                });

        });


        // POST REQUEST
        document.getElementById("sendData").addEventListener("click", function() {

            output.textContent = "Sending new post...";

            fetch("https://jsonplaceholder.typicode.com/posts", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    title: "My New Post",
                    body: "Learning Fetch API is fun!",
                    userId: 1
                })

            })

                .then(response => {
                    if (!response.ok) {
                        throw new Error("HTTP error! Status: " + response.status);
                    }

                    return response.json();
                })

                .then(data => {
                    output.innerHTML = `
                        <strong>New Post Created!</strong><br><br>
                        <strong>Post ID:</strong> ${data.id}<br>
                        <strong>Title:</strong> ${data.title}<br>
                        <strong>Content:</strong> ${data.body}
                    `;
                })

                .catch(error => {
                    output.textContent = "Error: " + error.message;
                });

        });

    </script>

</body>
</html>
